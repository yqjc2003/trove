<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拾藏</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<div class="topbar"><span class="mark">拾藏</span><details id="settings-menu" class="settings-menu"><summary aria-label="打开应用设置">···</summary><div class="menu-panel"><button id="open-ai" type="button">AI 设置</button><button type="button" disabled>云同步（尚未开放）</button></div></details></div>
<main id="library">
  <header><h1>留下值得回看的内容</h1><p>你的收藏保存在这台设备上。</p></header>
  <section aria-labelledby="add-heading">
    <h2 id="add-heading">收录链接</h2>
    <form id="add-form" class="stack">
      <div class="fields"><label>网址<input name="url" type="url" placeholder="https://" required></label><button id="analyze" type="button">解析网页</button></div>
      <p class="hint">解析时，网页标题和正文会发送给 DeepSeek 生成摘要与标签。</p>
      <label>标题<input name="title" maxlength="500" required></label>
      <label>摘要<textarea name="summary" maxlength="2000" rows="3"></textarea></label>
      <label>标签<input name="tags" placeholder="最多 3 个标签，用逗号分隔"></label>
      <div><button type="submit">保存收藏</button></div>
    </form><p id="message" role="status"></p>
  </section>
  <section aria-labelledby="list-heading"><div class="section-head"><h2 id="list-heading">我的收藏</h2><span id="count"></span></div><div id="items"></div></section>
</main>
<main id="reader" hidden>
  <div class="reader-actions"><button id="back" class="text-button" type="button">← 返回收藏</button><button id="open-original" class="text-button" type="button">打开原网页 ↗</button></div>
  <div class="reader-layout">
    <article class="reading-page" id="reading-page" aria-labelledby="reader-title">
      <div class="reader-meta">拾藏 / 阅读</div><h1 id="reader-title"></h1><p id="reader-url" class="reader-url"></p><div id="reader-body" class="reader-body"></div>
    </article>
    <aside class="reading-settings" aria-label="阅读设置">
      <h2>阅读设置</h2>
      <label>字体<select id="reader-font"><option value="serif">宋体</option><option value="sans">黑体</option><option value="kai">楷体</option></select></label>
      <label>字号 <span id="size-value">18 px</span><input id="reader-size" type="range" min="14" max="30" step="1" value="18"></label>
      <label>文字颜色<input id="reader-color" type="color" value="#242b27"></label>
      <label>背景<select id="reader-theme"><option value="white">纯白</option><option value="eye">护眼</option><option value="paper">纸张</option><option value="kindle">Kindle 电子屏</option></select></label>
    </aside>
  </div>
</main>
<dialog id="ai-dialog">
  <div class="dialog-head"><h2 id="ai-heading">AI 设置</h2><button id="close-ai" class="text-button" type="button" aria-label="关闭">✕</button></div>
  <form id="ai-form" class="stack">
    <div class="fields"><label>服务商<select name="provider"><option value="deepseek">DeepSeek</option></select></label><label>模型<input name="model" value="deepseek-chat" required></label></div>
    <label>API Key<input name="apiKey" type="password" autocomplete="off" placeholder="输入 DeepSeek API Key"></label>
    <p class="hint" id="key-status">密钥保存在本机，不会显示已有密钥。</p>
    <div><button type="submit">保存设置</button></div>
  </form><p id="settings-message" role="status"></p>
</dialog>
</body></html>
