<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>拾藏 · 登录与设置</title><link rel="stylesheet" href="style.css"></head><body><main><h1>拾藏</h1><p>登录与扩展设置</p><form id="settings"><h2>连接账号</h2><label>网站地址<input id="base" type="url" placeholder="https://你的拾藏网站" required></label><p>先登录网站，在「设置 → Agent 连接」创建 API Key，然后粘贴到这里。</p><button type="button" id="website" class="secondary">打开网站登录 / 创建 Key</button><label>拾藏 API Key<input id="key" type="password" autocomplete="off" required></label><h2>AI 解读 <small>可选</small></h2><p>收录时，当前网页的标题、地址和最多 12000 字正文会发送给所选模型服务商。未配置时可手工填写。</p><label>服务商<select id="provider"><option value="openai">ChatGPT / OpenAI</option><option value="deepseek">DeepSeek</option><option value="kimi">Kimi</option><option value="glm">GLM</option><option value="minimax">MiniMax</option><option value="custom">其他 OpenAI 兼容接口</option></select></label><label>Chat Completions 接口地址<input id="endpoint" type="url" placeholder="https://…/chat/completions"></label><label>模型名称<input id="model" placeholder="填写服务商支持的模型"></label><label>AI API Key<input id="aiKey" type="password" autocomplete="off"></label><button type="submit">验证并保存</button><p id="status" role="status"></p></form></main><script src="options.js"></script></body></html>
