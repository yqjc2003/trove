name: Release CatchLinger Skill

on:
  push:
    tags:
      - 'skill-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skill
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'catch-and-linger-release'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item 'skills/catch-and-linger' (Join-Path $dist 'catch-and-linger') -Recurse -Force
          Copy-Item 'scripts/install-catch-and-linger.ps1' (Join-Path $dist 'install-catch-and-linger.ps1') -Force
          $archive = Join-Path $env:GITHUB_WORKSPACE 'catch-and-linger.zip'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $archive -Force

      - name: Publish release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME 'catch-and-linger.zip' --title "Catch-and-Linger Skill $env:GITHUB_REF_NAME" --generate-notes
