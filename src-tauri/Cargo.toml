[package]
name = "catchlinger-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
url = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
scraper = "0.22"
open = "5"
htmd = "0.5"
pulldown-cmark = "0.13"
ammonia = "4"
base64 = "0.22"
tokio = { version = "1", features = ["net", "time", "sync"] }
futures-util = "0.3"
axum = "0.8"
rmcp = { version = "3.12", features = ["transport-streamable-http-server"] }
uuid = { version = "1", features = ["v4"] }
